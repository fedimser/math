[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
name = "fedimser-math"
version = "0.1.0"
description = "Mathematical projects"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT" 
authors = [{ name = "Dima Fedoriaka" }]

# https://peps.python.org/pep-0508/
dependencies = [
    "numba>=0.67",
    "numpy>=2.5",
    "pytest>=8.4.0",
    "scipy>=1.18",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["numopt*", "remez*", "rubiks-snake*"]

[tool.black]
line-length = 120